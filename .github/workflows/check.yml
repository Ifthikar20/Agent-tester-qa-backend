# The twenty-one checks, on every push and pull request.
#
# It does NOT deploy. That is deliberate and worth stating: this stack has one
# browser and one run lock, so recreating the runner mid-run kills somebody's
# session with no error anywhere. A deploy is a thing a person does while
# watching, which is why scripts/deploy.sh refuses when /healthz says busy.
#
# Because there is no deploy job there are no secrets here at all — no PEM, no
# host, nothing to leak, and no reason to open port 22 to GitHub's ranges.
name: checks

# Runs on every push and pull request — but not every job does.
#
# The browser suite (`checks`) is parked behind `if:` below rather than the
# whole workflow being parked, because three of the four jobs here need
# neither a browser nor a running server and are the ones that catch most
# regressions: the Django suite, the supply-chain assertions, and the image
# builds. Parking the workflow to keep one job from failing threw those away
# too, and a repository whose default branch runs no CI at all is worse than
# one with a job you know is pending.
on:
  push:
  pull_request:
  workflow_dispatch:

# The token this workflow is handed can read the repository and nothing
# else. Nothing here writes to it, and a job that could — through a
# compromised action, say — is the one thing a CI token is stolen for.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # On request only, and honestly so. Two things must be fixed first:
    #
    #   1. A `container:` job runs its steps as root, and Chromium refuses to
    #      start as root without --no-sandbox — which Dockerfile:39-41 explains
    #      is exactly the trade this project will not make. It needs
    #      `options: --user pwuser` and a chowned workspace, or a plain runner
    #      with `playwright install`.
    #   2. Most of these checks talk to a running server (scripts/check.js
    #      opens ws://localhost:3000). Nothing here starts one.
    #
    # A job that is red on every push teaches people to ignore red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The exact image Dockerfile pins, digest included. If they ever drift,
    # the browser this job runs against is not the browser production runs
    # against, and this job is the cheapest place to notice —
    # scripts/check-deploy.js asserts the two digests are the same.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # The three that need no browser, first, so a typo fails in seconds
      # rather than after the suite has launched Chromium twenty times.
      - run: npm run check:deploy
      - run: npm run check:app
      - run: npm run check:vocabulary
      - run: npm run check:all
        env:
          # The theatrical pace is right for a demo and wrong for CI.
          GC_PACE_MS: '0'

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The hashed file: pip turns hash-checking on by itself for a
      # requirements file that carries hashes, so this is the same install
      # the image does, and it fails the same way on a package that does
      # not match.
      - run: pip install -r auth/requirements.txt
      - run: python manage.py test
        working-directory: auth
        env:
          DJANGO_SECRET_KEY: not-a-real-key-just-for-tests-0123456789

  supply-chain:
    # What the two dependency sets are known to carry (docs/AUTH.md §12
    # [ops-supply-3]). A vulnerable pin fails the build; the fix is a new
    # pin in requirements.in or package.json, never an exception here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit
      # --require-hashes: audit the file exactly as the image installs it,
      # and refuse to audit a file that has lost its hashes.
      - run: pip-audit --require-hashes -r auth/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      # Production dependencies only: the bundler and the Vue toolchain
      # never reach the runner image, so an advisory there is not this
      # deployment's. High and above, because that is the level at which a
      # pin is changed on the day rather than at the next review.
      - run: npm run check:audit

  images:
    # Both images through `docker build`, and neither carrying a secret.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the runner
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghostclick-runner:ci
          build-args: |
            VITE_AUTH_URL=http://localhost
            GC_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build the control plane
        uses: docker/build-push-action@v6
        with:
          context: ./auth
          push: false
          load: true
          tags: ghostclick-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the pinned tag really does carry the browser this build wants
        run: docker run --rm ghostclick-runner:ci node -e "console.log(require('playwright').chromium.executablePath())"
      - name: and no secret rode in on either build context
        # The runner's context is the repository root — on the host, the
        # directory holding .env.prod, the PEM and the vault. The control
        # plane's is auth/, which holds the development account database
        # and a .env. Each image is asked for every file the other might
        # have picked up too, because a .dockerignore is one line from
        # forgetting one.
        run: |
          set -e
          for image in ghostclick-runner:ci ghostclick-control:ci; do
            for f in .env.prod .env .ghostclick/secrets.json auth/db.sqlite3 db.sqlite3 ghostclick-deploy.pem cansee-deploy.pem; do
              if docker run --rm --entrypoint sh "$image" -c "test -e '/app/$f'"; then
                echo "::error::$f is inside $image — check its .dockerignore"; exit 1
              fi
            done
            # Nor any PEM or env file under any name.
            found=$(docker run --rm --entrypoint sh "$image" -c "find /app -name '*.pem' -o -name '.env*' ! -name '.env.example' ! -name '.env.prod.example' 2>/dev/null" || true)
            if [ -n "$found" ]; then echo "::error::$image carries: $found"; exit 1; fi
          done
          echo "no .env.prod, no vault, no PEM, no account database in either image"
