# ghostclick in production shape: one runner, one control plane, one nginx.
#
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Read docs/DEPLOY.md first. The short version: GC_AUTH_SECRET is not optional
# on a host anyone else can reach, and both volumes below are load-bearing.

name: ghostclick

services:
  runner:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Baked into the bundle, so changing it rebuilds the image. Same value
        # as GC_WEB_ORIGIN — one origin, see docker/nginx.conf.
        VITE_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
        # There is no .git in the image; this is how /api/version knows.
        GC_GIT_SHA: ${GC_GIT_SHA:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      # The gate. Unset means the runner is open, and it says so at boot —
      # scripts/deploy.sh refuses to deploy without it.
      GC_AUTH_SECRET: ${GC_AUTH_SECRET:?set GC_AUTH_SECRET in .env.prod}
      GC_WEB_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
      # Nobody is watching a replay on a remote host through a browser tab, so
      # the performance is wasted here. Drop it to 250 if you want to watch.
      GC_PACE_MS: ${GC_PACE_MS:-250}
      GC_TIMEOUT_MS: ${GC_TIMEOUT_MS:-8000}
      GC_SETTLE_MS: ${GC_SETTLE_MS:-250}
    volumes:
      # Run history, the ORIGIN ALLOWLIST, the vault, the shared secret. Without
      # this every deploy forgets which origins were allowed and regenerates the
      # secret, which logs everyone out.
      - ghostclick-state:/app/.ghostclick
    # Chromium is told --disable-dev-shm-usage so it does not need a big /dev/shm,
    # but headroom here is cheap and a starved browser fails in confusing ways.
    shm_size: 512mb
    expose: ["3000"]
    # /healthz is 503 until chromium.launch returns. start_period covers the
    # browser download-free but still slow first boot; the deploy waits on this
    # same endpoint rather than on the UI, which answers long before the
    # browser exists.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      # The runner forwards the console of the page under test into its own
      # output, on a root volume it shares with both data volumes.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  control:
    build:
      context: ../auth
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.prod}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_DB_PATH: /app/db/db.sqlite3
      # The same key the runner verifies with. If these two ever differ, every
      # token is a "bad signature" and it reads as a broken login.
      GC_AUTH_SECRET: ${GC_AUTH_SECRET:?set GC_AUTH_SECRET in .env.prod}
      GC_WEB_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
      GC_TOKEN_TTL: ${GC_TOKEN_TTL:-600}
      GC_ADMIN_PATH: ${GC_ADMIN_PATH:?set GC_ADMIN_PATH in .env.prod}
    volumes:
      - control-db:/app/db
      - control-static:/app/staticfiles
    expose: ["8000"]
    healthcheck:
      # stdlib only, so auth/requirements.txt stays four lines.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/auth/csrf', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      GC_ADMIN_PATH: ${GC_ADMIN_PATH:?set GC_ADMIN_PATH in .env.prod}
      # Substitute THIS AND NOTHING ELSE. Without the filter, envsubst also
      # replaces $host, $remote_addr, $proxy_add_x_forwarded_for and
      # $http_upgrade with empty strings, and the WebSocket 400s silently.
      NGINX_ENVSUBST_FILTER: GC_ADMIN_PATH
    # condition matters: nginx resolves `runner` and `control` once, at config
    # load. Starting before they exist makes it exit, and `restart` then papers
    # over it with a crash loop that reads as a broken config.
    depends_on:
      runner: { condition: service_healthy }
      control: { condition: service_healthy }
    ports:
      - "80:80"
    volumes:
      # A template, not a config: the image runs envsubst over
      # /etc/nginx/templates/*.template at boot and writes conf.d/default.conf.
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Django's admin CSS, collected by the deploy script.
      - control-static:/app/staticfiles:ro
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ghostclick-state:
  control-db:
  control-static:
