# ghostclick in production shape: one edge, one runner, one control plane, and
# the two stores the control plane keeps its counters and its people in.
#
#   ./scripts/gc up -d --build          (never `docker compose` longhand — see scripts/gc)
#
# Read docs/DEPLOY.md first. The short version: every value with :? below is
# one the stack cannot come up correctly without, and the deploy script
# refuses a .env.prod that only looks filled in.
#
# Two networks, and which side of the line each service is on is the whole
# point (docs/AUTH.md §0):
#
#   edge   caddy <-> runner, caddy <-> control. The internet reaches caddy.
#   data   control <-> postgres, control <-> redis. `internal`: no route out.
#
# The runner — and therefore the Chromium it drives at pages other people
# choose — is on `edge` only. It has no route to the control plane, the
# database or the cache, so a page that escapes the browser lands in a
# container that cannot reach the thing that decides who anyone is.

name: ghostclick

networks:
  edge:
  data:
    internal: true

# Every image that is not built here is pinned by digest as well as by tag
# (docs/AUTH.md §12 [ops-supply-3]): a tag is a name the registry can point
# somewhere else tomorrow, a digest is the image that was tested. To move,
# `docker buildx imagetools inspect <image:tag>` prints the new one.

services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Caddy resolves `runner` and `control` per request, so it would come up
    # fine before them — but a deploy should not put an edge on the internet
    # that answers 502 for its first minute.
    depends_on:
      runner: { condition: service_healthy }
      control: { condition: service_healthy }
    environment:
      # The site address. https://host gets certificates automatically.
      GC_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
      # Who may reach /admin/. Space-separated CIDRs; the default is an
      # address nothing is ever sent from, which is the right answer for an
      # operator who has not chosen.
      GC_ADMIN_CIDRS: ${GC_ADMIN_CIDRS:-192.0.2.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means asking
      # Let's Encrypt again, and there is a rate limit on asking.
      - caddy-data:/data
      - caddy-config:/config
      # Django's admin CSS, collected by the deploy script.
      - control-static:/srv/static:ro
    networks: [edge]
    cap_drop: [ALL]
    # The one capability the edge needs: ports 80 and 443. Docker lets a
    # container bind them without it since 20.10, but saying so costs nothing
    # and stops working out loud on a host where it does not.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  runner:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Baked into the bundle, so changing it rebuilds the image. The UI
        # signs in at its own origin — the edge fronts both services.
        VITE_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
        # There is no .git in the image; this is how /api/version knows.
        GC_GIT_SHA: ${GC_GIT_SHA:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      # The gate. The PUBLIC half of the signing key, as {kid: pem}; the
      # private half never reaches this container. Unset means the runner is
      # open, and it says so at boot — scripts/deploy.sh refuses to deploy
      # without it.
      GC_AUTH_PUBLIC_KEYS: ${GC_AUTH_PUBLIC_KEYS:?set GC_AUTH_PUBLIC_KEYS in .env.prod}
      GC_WEB_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
      # Nobody is watching a replay on a remote host through a browser tab, so
      # the performance is wasted here. Drop it to 250 if you want to watch.
      GC_PACE_MS: ${GC_PACE_MS:-250}
      GC_TIMEOUT_MS: ${GC_TIMEOUT_MS:-8000}
      GC_SETTLE_MS: ${GC_SETTLE_MS:-250}
      # How long an organisation keeps the one browser after its run has
      # ended and its viewers have gone quiet (docs/AUTH.md §10); a minute
      # unless said otherwise.
      GC_RUNNER_IDLE_MS: ${GC_RUNNER_IDLE_MS:-60000}
      # The same public site key the control plane hands the UI. The runner
      # never uses its value; its presence widens the UI's CSP to admit the
      # Turnstile widget's host, and one line feeding both services is how
      # the policy and the page cannot disagree about whether it exists.
      GC_TURNSTILE_SITE_KEY: ${GC_TURNSTILE_SITE_KEY:-}
      # The recorder extension's origins (docs/AUTH.md §11): the runner
      # answers CORS for them on the gated POST /api/recording, and the
      # control plane trusts the same list for CSRF when it hands the
      # extension a token — one line, two readers, so they cannot differ.
      GC_EXTENSION_ORIGINS: ${GC_EXTENSION_ORIGINS:-}
    volumes:
      # Run history, the ORIGIN ALLOWLIST, the vault — one directory per
      # organisation, .ghostclick/<org>/. Without this every deploy forgets
      # which origins were allowed and every run ever made.
      - ghostclick-state:/app/.ghostclick
    # Chromium is told --disable-dev-shm-usage so it does not need a big /dev/shm,
    # but headroom here is cheap and a starved browser fails in confusing ways.
    shm_size: 512mb
    expose: ["3000"]
    # `edge` only. No route to control, postgres or redis — see the header.
    networks: [edge]
    # Playwright launches Chromium with --no-sandbox unless told otherwise,
    # so nothing in this container needs a capability or a setuid helper.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # /healthz is 503 until chromium.launch returns. start_period covers the
    # browser download-free but still slow first boot; the deploy waits on this
    # same endpoint rather than on the UI, which answers long before the
    # browser exists.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      # The runner forwards the console of the page under test into its own
      # output, on a root volume it shares with both data volumes.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  control:
    build:
      context: ../auth
      dockerfile: Dockerfile
    # Named, so the scheduler below runs the SAME image rather than a second
    # build of the same context.
    image: ghostclick-control
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &control-env
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.prod}
      # Hosts, origins and cookie flags are all derived from this one value
      # (auth/config/settings.py). There is no DJANGO_ALLOWED_HOSTS here on
      # purpose; a '*' would be refused at import anyway.
      GC_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
      # Both passwords must be URL-safe (letters, digits, - and _): they are
      # spliced into these URLs unescaped.
      DATABASE_URL: postgres://ghostclick:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/ghostclick
      GC_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}@redis:6379/0
      # The PRIVATE half of the signing key — this container and nowhere
      # else. The runner holds the public half; if the two were not made
      # together every token is a "bad signature" and reads as a broken login.
      GC_SIGNING_KEY: ${GC_SIGNING_KEY:?set GC_SIGNING_KEY in .env.prod}
      GC_TOKEN_TTL: ${GC_TOKEN_TTL:-600}
      # The key TOTP secrets and recovery codes are encrypted with at rest
      # (docs/AUTH.md §12) — this container only, like the signing key, and
      # required: without it the settings module refuses to start rather
      # than store second factors in the clear.
      GC_MFA_KEY: ${GC_MFA_KEY:?set GC_MFA_KEY in .env.prod}
      # Mail. SMTP unless a backend is named; the settings module refuses SMTP
      # with no host rather than let the first password reset find out.
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # Who may sign up (docs/AUTH.md §4): invite unless told otherwise, and
      # domain mode needs its domains or the settings module refuses to start.
      GC_SIGNUP_MODE: ${GC_SIGNUP_MODE:-invite}
      GC_SIGNUP_DOMAINS: ${GC_SIGNUP_DOMAINS:-}
      # Cloudflare Turnstile, both halves or neither (the settings module
      # refuses one without the other). The secret is this container's only.
      GC_TURNSTILE_SECRET: ${GC_TURNSTILE_SECRET:-}
      GC_TURNSTILE_SITE_KEY: ${GC_TURNSTILE_SITE_KEY:-}
      # Sign in with Google (docs/AUTH.md §6), both halves or neither. This
      # container only: the runner never talks to Google, and the UI learns
      # whether the button exists from GET /auth/config.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # The recorder extension's origins, trusted for CSRF when the
      # extension asks for a token with the person's session (docs/AUTH.md
      # §11). The same line the runner reads for CORS.
      GC_EXTENSION_ORIGINS: ${GC_EXTENSION_ORIGINS:-}
    volumes:
      - control-static:/app/staticfiles
    expose: ["8000"]
    networks: [edge, data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # stdlib only. The Host header matters: ALLOWED_HOSTS is exactly the
      # public host now, so a probe that says "localhost" is a 400.
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://localhost:8000/auth/csrf', headers={'Host': urlsplit(os.environ['GC_PUBLIC_URL']).hostname}); sys.exit(0 if urllib.request.urlopen(r, timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The schedule (docs/AUTH.md §12): the control-plane image again, running
  # `manage.py housekeeping` — clearsessions and the audit-log purge daily,
  # the stale-address purge every five minutes — with the same environment,
  # so it needs no crontab and its output is `./scripts/gc logs scheduler`.
  # Same networks, same dropped capabilities; it is the control plane doing
  # its own chores, not a new kind of process.
  scheduler:
    image: ghostclick-control
    command: ["python", "manage.py", "housekeeping"]
    restart: unless-stopped
    depends_on:
      control: { condition: service_healthy }
    environment: *control-env
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    # As the postgres user from the start, so the entrypoint never needs to
    # chown or drop privileges — which is what lets every capability go.
    user: postgres
    environment:
      POSTGRES_USER: ghostclick
      POSTGRES_DB: ghostclick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      # scram-sha-256 for every connection, local ones included. md5 is the
      # image default and is the one thing pg_hba still lets you get wrong.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      # The accounts, the sessions, the audit log. Without this every deploy
      # is a fresh database with nobody in it.
      - postgres-data:/var/lib/postgresql/data
    # `data` only: nothing but the control plane can open a connection, and
    # the network has no route to the internet.
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostclick -d ghostclick"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    user: redis
    # Counters only — rate limits, lockouts — so nothing is persisted: a
    # restart forgetting them is a restart handing out a few extra attempts,
    # not a restart losing data. requirepass because "internal network" is a
    # statement about routing, not about who is on it.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
      # redis-cli reads this for the healthcheck, so the password is not in
      # the healthcheck's command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ghostclick-state:
  postgres-data:
  control-static:
  caddy-data:
  caddy-config:
