# Front Chrome's DevTools endpoint so a runner in ANOTHER container can attach.
#
# Two things stop a cross-container attach, and this config fixes both:
#
# 1. Host header. Chromium binds the debug port to its own 127.0.0.1 and refuses
#    any HTTP request whose Host is not localhost/an IP (DNS-rebinding defense),
#    so a runner connecting as `http://chrome:9223` would get a 500 from Chrome.
#    We rewrite Host to 127.0.0.1:9222, which Chrome accepts. (socat can't: it
#    passes the Host header through untouched.)
#
# 2. Discovery URL. Chrome builds webSocketDebuggerUrl from that (rewritten)
#    Host, so /json/version hands the runner `ws://127.0.0.1:9222/...` — which,
#    inside the runner's OWN container, is its localhost, not Chrome. The WS
#    connect then fails with ECONNREFUSED. So we rewrite the JSON body to point
#    the WS URL back at THIS proxy (`chrome:9223`), which the runner can reach;
#    the follow-up WS upgrade to chrome:9223 lands here and is proxied to Chrome.
#
# This shares Chrome's network namespace, so 127.0.0.1 here IS Chrome.
# --remote-allow-origins=* on Chrome covers the WS Origin.
server {
    listen 9223;

    location / {
        proxy_pass http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9222;   # (1) Chrome accepts this Host
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;               # keep the CDP socket open
        proxy_buffering off;

        # (2) rewrite the discovery JSON so the WS URL is reachable from the
        # runner. Accept-Encoding "" stops Chrome gzipping (sub_filter needs
        # a plain-text body); only application/json bodies are touched, so the
        # 101 WebSocket upgrade passes through untouched.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter "127.0.0.1:9222" "chrome:9223";
        sub_filter_once off;
    }
}
