<!doctype html>
<meta charset="utf-8">
<title>Wrapped — a link on two lines</title>
<!--
  A link whose words wrap onto two lines. The centre of its bounding box is the
  gap between the lines, which the paragraph owns — the pixel a replay used to
  press. Beside it: a link to the same page on another host (127.0.0.1 and
  localhost are two origins served by one runner), the same link on this host,
  a button that does nothing, and, with ?covered, a transparent layer over all
  of it that no press should ever be reported as landing on.
-->
<style>
  body{font:15px/1.7 system-ui,sans-serif;max-width:620px;margin:60px auto;padding:0 24px;color:#16181d}
  h1{font-size:26px;letter-spacing:-.01em}
  .story{font-size:20px;line-height:1.625;width:560px}
  a{color:#1f5fd0}
  .veil{position:fixed;inset:0;background:transparent;display:none}
  .covered .veil{display:block}
</style>
<h1>Where a press lands</h1>
<p class="story">Read the profile: <a id="story" href="/pricing.html"><em>These 20-year-olds have grown their AI note-taking app for students by 5 million</em></a> since last spring.</p>
<p>
  <a id="away" href="/pricing.html">Read it on the other host</a> ·
  <a id="here" href="/pricing.html">Read it here</a> ·
  <button id="nothing" type="button">Does nothing</button>
</p>
<div class="veil" aria-label="Veil"></div>
<script>
  document.getElementById('away').href = 'http://127.0.0.1:' + (location.port || '80') + '/pricing.html';
  document.getElementById('nothing').addEventListener('click', function () {});
  if (/[?&]covered\b/.test(location.search)) document.body.classList.add('covered');
</script>
