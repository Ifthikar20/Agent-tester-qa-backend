<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbour — Contact us</title>
<style>
  :root { font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin:0; background:#f6f7f9; color:#1b2330; }
  .bar { background:#fff; border-bottom:1px solid #dfe4ec; padding:14px 28px;
         display:flex; gap:26px; align-items:center; }
  .bar strong { font-size:17px; letter-spacing:-.01em; }
  .bar a { color:#41506a; text-decoration:none; font-size:14px; }
  /* A link that arrives late: in the document from the start, sized to nothing
     until the page decides to show it — the shape of a nav a script fills in. */
  .bar a.late { display:block; height:0; overflow:hidden; }
  .wrap { max-width:560px; margin:56px auto; background:#fff; padding:34px 38px;
          border:1px solid #dfe4ec; border-radius:10px; }
  h1 { font-size:21px; margin:0 0 6px; letter-spacing:-.015em; }
  p.lead { margin:0 0 18px; color:#5b6880; font-size:14px; }
  label { display:block; font-size:13px; color:#5b6880; margin:18px 0 6px; }
  input, textarea { width:100%; box-sizing:border-box; padding:11px 13px; font-size:15px;
          border:1px solid #c9d2e0; border-radius:7px; background:#fff; font-family:inherit; }
  textarea { min-height:96px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid #2f6fd0; outline-offset:1px; border-color:#2f6fd0; }
  button { margin-top:24px; padding:11px 20px; font-size:14px; font-weight:600;
           background:#2f6fd0; color:#fff; border:0; border-radius:7px; cursor:pointer; }
  .toast { margin-top:20px; padding:11px 14px; border-radius:7px; font-size:14px;
           background:#e7f6ec; color:#1c6b39; border:1px solid #bfe5cd; }
  .error { margin-top:20px; padding:11px 14px; border-radius:7px; font-size:14px;
           background:#fdecec; color:#9b2222; border:1px solid #f3c2c2; }
  .hide { display:none; }
</style>
</head>
<body>
<!--
  Harbour — a contact page shaped to be tested (chat-plan.js, check-chat.js §10):
    · "Our story" is a link the page shows LATE (?after=N ms, default 4300):
      a click recorded against it fails on timing the first time, and the
      runner's own words say how long to wait
    · "Download the brochure" goes to a path nobody serves: the application is
      broken there, and no revision of a test can make it right
    · the Message field silently keeps 200 characters (demo.html's convention):
      a check on what was typed catches it
-->
<div class="bar">
  <strong>Harbour</strong>
  <a href="/contact.html?story=1" id="story" class="late">Our story</a>
  <a href="/brochure.pdf" id="brochure">Download the brochure</a>
</div>

<div class="wrap" id="contact">
  <h1>Talk to us</h1>
  <p class="lead">Every order, every carrier. Tell us what you are shipping.</p>
  <label for="name">Full name</label>
  <input id="name" type="text" autocomplete="off">
  <label for="email">Work email</label>
  <input id="email" type="email" autocomplete="off">
  <label for="msg">Message</label>
  <textarea id="msg"></textarea>
  <button id="send" type="button">Send message</button>
  <div class="error hide" id="error"></div>
  <div class="toast hide" id="thanks">Thanks, we will be in touch within a day.</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const show = (el, on) => el.classList.toggle('hide', !on);
  const after = Number(new URLSearchParams(location.search).get('after') || 4300);
  setTimeout(() => $('story').classList.remove('late'), after);

  $('send').onclick = () => {
    show($('error'), false);
    show($('thanks'), false);
    if (!$('name').value.trim()) { $('error').textContent = 'Full name is required.'; show($('error'), true); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email').value.trim())) { $('error').textContent = 'Work email must be an email address.'; show($('error'), true); return; }
    $('msg').value = $('msg').value.slice(0, 200);   // <- silent truncation
    show($('thanks'), true);
  };
</script>
</body>
</html>
