<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian — Account</title>
<style>
  :root { font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin:0; background:#f6f7f9; color:#1b2330; }
  .bar { background:#fff; border-bottom:1px solid #dfe4ec; padding:14px 28px;
         display:flex; gap:26px; align-items:center; }
  .bar strong { font-size:17px; letter-spacing:-.01em; }
  .bar a { color:#41506a; text-decoration:none; font-size:14px; }
  .wrap { max-width:560px; margin:56px auto; background:#fff; padding:34px 38px;
          border:1px solid #dfe4ec; border-radius:10px; }
  h1 { font-size:21px; margin:0 0 22px; letter-spacing:-.015em; }
  label { display:block; font-size:13px; color:#5b6880; margin:18px 0 6px; }
  input { width:100%; box-sizing:border-box; padding:11px 13px; font-size:15px;
          border:1px solid #c9d2e0; border-radius:7px; background:#fff; }
  input:focus { outline:2px solid #2f6fd0; outline-offset:1px; border-color:#2f6fd0; }
  button { margin-top:24px; padding:11px 20px; font-size:14px; font-weight:600;
           background:#2f6fd0; color:#fff; border:0; border-radius:7px; cursor:pointer; }
  .tabs { display:flex; gap:8px; margin-bottom:8px; }
  .tabs button { margin:0; background:#eef1f6; color:#2b3547; font-weight:500; }
  .tabs button[aria-selected=true] { background:#2f6fd0; color:#fff; }
  .toast { margin-top:20px; padding:11px 14px; border-radius:7px; font-size:14px;
           background:#e7f6ec; color:#1c6b39; border:1px solid #bfe5cd; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="bar">
  <strong>Meridian</strong>
  <a href="#" id="navSettings">Settings</a>
</div>

<!-- login -->
<div class="wrap" id="login">
  <h1>Sign in to your account</h1>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="off">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off">
  <button id="signin">Sign in</button>
</div>

<!-- settings -->
<div class="wrap hide" id="settings">
  <h1>Settings</h1>
  <div class="tabs">
    <button id="tabGeneral" aria-selected="true">General</button>
    <button id="tabProfile" aria-selected="false">Profile</button>
  </div>
  <div id="paneGeneral">
    <label for="tz">Time zone</label>
    <input id="tz" value="America/Chicago">
  </div>
  <div id="paneProfile" class="hide">
    <label for="un">Username</label>
    <!-- The bug under test: silently truncates past 16 chars, no error shown. -->
    <input id="un" maxlength="40" value="ali">
    <button id="save">Save changes</button>
    <div id="toast" class="toast hide"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const show = (el, on) => el.classList.toggle('hide', !on);

  $('signin').onclick = () => {
    if (!$('em').value || !$('pw').value) return;
    show($('login'), false);
    history.pushState({}, '', '/demo.html#/dashboard');
  };

  $('navSettings').onclick = (e) => {
    e.preventDefault();
    show($('login'), false); show($('settings'), true);
    history.pushState({}, '', '/demo.html#/settings');
  };

  $('tabProfile').onclick = () => {
    $('tabProfile').setAttribute('aria-selected','true');
    $('tabGeneral').setAttribute('aria-selected','false');
    show($('paneGeneral'), false); show($('paneProfile'), true);
  };
  $('tabGeneral').onclick = () => {
    $('tabGeneral').setAttribute('aria-selected','true');
    $('tabProfile').setAttribute('aria-selected','false');
    show($('paneProfile'), false); show($('paneGeneral'), true);
  };

  $('save').onclick = () => {
    const stored = $('un').value.slice(0, 16);   // <- silent truncation
    $('un').value = stored;
    $('toast').textContent = 'Profile saved.';
    show($('toast'), true);
  };
</script>
</body>
</html>
