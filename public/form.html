<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian — Sign up</title>
<style>
  :root { font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin:0; background:#f6f7f9; color:#1b2330; }
  .bar { background:#fff; border-bottom:1px solid #dfe4ec; padding:14px 28px;
         display:flex; gap:26px; align-items:center; }
  .bar strong { font-size:17px; letter-spacing:-.01em; }
  .bar form { margin-left:auto; }
  .bar input { width:220px; padding:8px 11px; font-size:14px; border:1px solid #c9d2e0; border-radius:7px; }
  .wrap { max-width:560px; margin:56px auto; background:#fff; padding:34px 38px;
          border:1px solid #dfe4ec; border-radius:10px; }
  h1 { font-size:21px; margin:0 0 22px; letter-spacing:-.015em; }
  label { display:block; font-size:13px; color:#5b6880; margin:18px 0 6px; }
  input, select { width:100%; box-sizing:border-box; padding:11px 13px; font-size:15px;
                  border:1px solid #c9d2e0; border-radius:7px; background:#fff; }
  input:focus, select:focus { outline:2px solid #2f6fd0; outline-offset:1px; border-color:#2f6fd0; }
  .check { display:flex; align-items:center; gap:10px; margin-top:18px; font-size:14px; color:#1b2330; }
  .check input { width:auto; margin:0; }
  button { margin-top:24px; padding:11px 20px; font-size:14px; font-weight:600;
           background:#2f6fd0; color:#fff; border:0; border-radius:7px; cursor:pointer; }
  .toast { margin-top:20px; padding:11px 14px; border-radius:7px; font-size:14px;
           background:#e7f6ec; color:#1c6b39; border:1px solid #bfe5cd; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="bar">
  <strong>Meridian</strong>
  <!-- A search that only Enter submits: there is no button to click. -->
  <form id="search" role="search">
    <input id="q" type="search" placeholder="Search the docs" aria-label="Search">
  </form>
</div>

<!-- The form under test: a dropdown, a checkbox, and Enter in a field submits it. -->
<div class="wrap" id="signup">
  <h1>Create your account</h1>
  <form id="form">
    <label for="name">Name</label>
    <input id="name" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="off">
    <label for="plan">Plan</label>
    <select id="plan">
      <option>Monthly</option>
      <option>Yearly</option>
      <option>Team</option>
    </select>
    <label class="check"><input id="remember" type="checkbox"> Remember me</label>
    <label class="check"><input id="news" type="checkbox" checked> Send me the newsletter</label>
    <button id="signup-btn" type="submit">Sign up</button>
  </form>
  <div id="toast" class="toast hide" role="status"></div>
</div>

<!-- Where a search lands: the words searched for, so a check can see them. -->
<div class="wrap hide" id="results">
  <h1>Search</h1>
  <p id="resultsFor"></p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('name').value.trim() || 'you';
    const plan = $('plan').value;
    const bits = [`Account created for ${name} on the ${plan} plan`];
    if ($('remember').checked) bits.push('remembered on this device');
    if ($('news').checked) bits.push('newsletter on');
    $('toast').textContent = bits.join(' — ') + '.';
    $('toast').classList.remove('hide');
    location.hash = '#/welcome';
  });
  $('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    $('signup').classList.add('hide');
    $('results').classList.remove('hide');
    $('resultsFor').textContent = `Results for "${q}": nothing yet.`;
    location.hash = `#/search?q=${encodeURIComponent(q)}`;
  });
</script>
</body>
</html>
