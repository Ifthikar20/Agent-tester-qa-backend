<!doctype html>
<meta charset="utf-8">
<title>Basket — a sign-in button another site draws in a frame</title>
<!--
  Two buttons of the page's own, and a sign-in button drawn by another origin
  inside an iframe (in-frame-button.html, served from http://frame.test the way
  Google's /gsi/button is served from accounts.google.com). The recorder saw the
  press on that button and wrote its name, and the name is right — but a target
  names elements of the page, never of a frame, so the step can never pass:
  not with a wait, not with a rename, not with a layer closed. The runner must
  say exactly that, in every mode, and never spend a model call on it.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  main{position:absolute;left:40px;top:40px}
  button{font:inherit;padding:8px 18px;margin-right:10px}
  iframe{display:block;margin-top:12px;width:320px;height:70px;border:1px solid #ccc}
</style>
<main>
  <h1 id="h">Basket: 0 items</h1>
  <p><button id="add" type="button">Add item</button><button id="refresh" type="button">Refresh</button></p>
  <p>Sign in to save your basket:</p>
  <iframe title="Sign in with Google" src="http://frame.test/in-frame-button.html?client_id=demo123"></iframe>
</main>
<script>
  let n = 0;
  document.getElementById('add').onclick = () => { n++; document.getElementById('h').textContent = `Basket: ${n} item${n === 1 ? '' : 's'}`; };
</script>
