<!doctype html>
<meta charset="utf-8">
<title>A replacement whose name carries the vault secret</title>
<!--
  The recorded "Continue" now reads "Continue as vault-S3cret-value" — the
  vault's value, printed into the button. Pressing it is still the step the
  person recorded, so the run may pass; but writing that name into the test
  would copy the secret into the case. The fix counts for the run and is not
  offered as a change.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  button{position:absolute;left:300px;top:300px;padding:8px 16px;font:inherit;border:0;border-radius:8px;background:#2f5bea;color:#fff}
</style>
<main><h1>Almost there</h1><button type="button" id="go">Continue as vault-S3cret-value</button></main>
<script>
  document.getElementById('go').onclick = () => { location.hash = '#/next'; };
</script>
