<!doctype html>
<meta charset="utf-8">
<title>Harbour — the nav renders late</title>
<!--
  A harmless difference: the nav link arrives by script, after the step's timeout
  but inside its grace period. ?ms says when.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ea;padding:14px 32px}
  nav a{margin-right:22px;color:#2f5bea}
  section{height:900px;padding:32px}
</style>
<header><nav aria-label="Main" id="nav"><a href="#">Harbour</a></nav></header>
<main><section id="top">Harbour</section><section id="pricing">Pricing</section></main>
<script>
  const ms = Number(new URLSearchParams(location.search).get('ms')) || 1800;
  setTimeout(() => document.getElementById('nav').insertAdjacentHTML('beforeend', '<a href="#pricing">Pricing</a>'), ms);
</script>
