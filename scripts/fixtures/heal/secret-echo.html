<!doctype html>
<meta charset="utf-8">
<title>Sign in — a page that prints what you typed</title>
<!--
  The report the model sees must never carry a typed value or a secret. This
  page makes that hard: the password field's value is echoed into a paragraph,
  where no field-value stripping reaches it, and the Continue button the step
  wants is gone so the model is asked.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  main{max-width:560px;margin:80px auto;padding:0 32px}
  label{display:block;margin:0 0 16px;font-size:13px;color:#5b6880}
  input{display:block;width:100%;height:40px;margin-top:4px;padding:0 12px;border:1px solid #d6d9de;border-radius:8px;font:inherit}
</style>
<main>
  <h1>Sign in</h1>
  <label>Email <input id="em" type="email" autocomplete="off"></label>
  <label>Password <input id="pw" type="password" autocomplete="off"></label>
  <label>PIN <input id="pin" type="password" autocomplete="off"></label>
  <p id="echo"></p>
</main>
<script>
  const pw = document.getElementById('pw');
  pw.addEventListener('input', () => { document.getElementById('echo').textContent = `Debug token: ${pw.value}`; });
</script>
