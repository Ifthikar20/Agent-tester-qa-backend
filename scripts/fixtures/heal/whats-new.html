<!doctype html>
<meta charset="utf-8">
<title>Harbour — What's new on load</title>
<!--
  A harmless difference: an announcement dialog over a full-page backdrop. The
  backdrop is what catches the press; the dialog and its Close are inside it.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ea;padding:14px 32px}
  nav a{margin-right:22px;color:#2f5bea}
  section{height:900px;padding:32px}
  .backdrop{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,.5);display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;max-width:420px;padding:24px;border-radius:12px}
</style>
<header><nav aria-label="Main"><a href="#">Harbour</a><a href="#pricing">Pricing</a><a href="#docs">Docs</a></nav></header>
<main><section id="top">Harbour</section><section id="pricing">Pricing</section><section id="docs">Docs</section></main>
<div class="backdrop" id="whatsNew">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wn">
    <h2 id="wn">What's new</h2>
    <p>Pricing has a calculator now, and the docs have search.</p>
    <button type="button" id="close">Close</button>
  </div>
</div>
<script>
  document.getElementById('close').onclick = () => document.getElementById('whatsNew').remove();
</script>
