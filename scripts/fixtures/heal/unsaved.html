<!doctype html>
<meta charset="utf-8">
<title>Editor — Unsaved changes</title>
<!--
  A question the app is asking: unsaved changes, keep editing or discard. It
  mentions a welcome message and has a close button; the veto has to win.
-->
<style>
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#16181d}
  main{max-width:520px;margin:80px auto;padding:0 32px}
  .backdrop{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,.5);display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;max-width:420px;padding:24px;border-radius:12px}
</style>
<main>
  <h1>Edit the welcome message</h1>
  <a href="#/projects">Back to projects</a>
</main>
<div class="backdrop" id="unsaved">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="uc">
    <h2 id="uc">Unsaved changes</h2>
    <p>Your welcome message has changes that are not saved yet.</p>
    <button type="button">Keep editing</button>
    <button type="button" id="discard">Discard</button>
    <button type="button" aria-label="Close" id="x">×</button>
  </div>
</div>
<script>
  const gone = () => document.getElementById('unsaved').remove();
  document.getElementById('discard').onclick = gone;
  document.getElementById('x').onclick = gone;
</script>
